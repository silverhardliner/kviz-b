<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f6f5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kvíz B">
<title>Kvíz B</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f6f7f5; --card: #ffffff; --text: #1c2321; --muted: #5d6b66;
  --line: #dfe4e1; --accent: #1f6f5c; --accent-ink: #ffffff;
  --ok: #1e8a4c; --ok-bg: #e3f4ea; --bad: #c0392b; --bad-bg: #fbe7e4;
  --warn: #9a6b00; --chip: #eef2f0; --shadow: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121615; --card: #1b201f; --text: #e8edeb; --muted: #9aa8a3;
    --line: #2c3432; --accent: #4fb89c; --accent-ink: #0d1a16;
    --ok: #5fd08f; --ok-bg: #173325; --bad: #ff7b6b; --bad-bg: #3a1d1a;
    --warn: #e2b54a; --chip: #232a28; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #121615; --card: #1b201f; --text: #e8edeb; --muted: #9aa8a3;
  --line: #2c3432; --accent: #4fb89c; --accent-ink: #0d1a16;
  --ok: #5fd08f; --ok-bg: #173325; --bad: #ff7b6b; --bad-bg: #3a1d1a;
  --warn: #e2b54a; --chip: #232a28; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: max(12px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  max-width: 720px; margin: 0 auto; -webkit-tap-highlight-color: transparent;
}
h1 { font-size: 1.35rem; margin: .2rem 0 .1rem; }
h2 { font-size: 1.1rem; margin: 1.2rem 0 .5rem; }
.muted { color: var(--muted); font-size: .9rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); margin: 10px 0; }
button { font: inherit; color: inherit; }
.btn { display: block; width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); text-align: left; margin: 8px 0; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; text-align: center; }
.btn .sub { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; }
.btn.primary .sub { color: inherit; opacity: .85; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); font-size: .88rem; cursor: pointer; user-select: none; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.link { background: none; border: 0; color: var(--accent); padding: 6px 0; cursor: pointer; font-weight: 600; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); margin-bottom: 8px; }
.tag { padding: 2px 8px; border-radius: 999px; background: var(--chip); }
.tag.rep { color: var(--warn); }
.stem { font-size: 1.12rem; font-weight: 600; margin: 4px 0 12px; }
.opt { display: flex; gap: 10px; width: 100%; text-align: left; padding: 13px 12px; margin: 8px 0; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; }
.opt .k { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt.sel { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.explain { border-left: 4px solid var(--accent); padding: 8px 12px; background: var(--card); border-radius: 8px; margin-top: 10px; }
.explain.bad { border-color: var(--bad); }
.explain.ok { border-color: var(--ok); }
.src { font-size: .8rem; color: var(--muted); margin-top: 6px; }
.bar { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.subj { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.subj:last-child { border-bottom: 0; }
.subj .n { font-size: .82rem; color: var(--muted); }
.subj .bar { grid-column: 1 / -1; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; }
.timer.low { color: var(--bad); }
.big { font-size: 2.2rem; font-weight: 800; margin: 6px 0; }
.pass { color: var(--ok); } .fail { color: var(--bad); }
.sticky { position: sticky; bottom: max(10px, env(safe-area-inset-bottom)); }
.prehled details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 8px 0; padding: 4px 12px; }
.prehled summary { font-weight: 700; padding: 8px 0; cursor: pointer; }
.prehled code { font-size: .78rem; color: var(--muted); background: none; white-space: normal; }
.prehled table { border-collapse: collapse; font-size: .85rem; display: block; overflow-x: auto; }
.prehled th, .prehled td { border: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
.prehled ul { padding-left: 1.1rem; }
.prehled li { margin: 6px 0; }
.prehled h3 { font-size: 1rem; margin: 14px 0 4px; }
.prehled h4 { font-size: .95rem; margin: 12px 0 4px; }
.prehled blockquote { margin: 8px 0; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--chip); border-radius: 6px; }
.hidden { display: none !important; }
.center { text-align: center; }
.small { font-size: .85rem; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: .9rem; z-index: 9; }
</style>
</head>
<body>
<main id="app"><p class="muted">Načítám…</p></main>
<script src="app.js"></script>
</body>
</html>
